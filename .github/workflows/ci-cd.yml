name: CI/CD - Flask API to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two applies/deploys at the same time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  PYTHON_VERSION: "3.12"
  TF_VERSION: "1.10.5"
  TF_STATE_KEY: flask-ec2/terraform.tfstate

jobs:
  # ---------------------------------------------------------------
  # 1. CI: lint + unit tests. Runs on every push and pull request.
  # ---------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Run tests (pytest)
        run: pytest -v --cov=app --cov-report=term-missing

  # ---------------------------------------------------------------
  # 2. Terraform: plan on PRs, apply on main. Only runs if tests pass.
  # ---------------------------------------------------------------
  terraform:
    name: Terraform
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_aws_region: ap-south-1
      TF_VAR_ssh_public_key: ${{ secrets.EC2_SSH_PUBLIC_KEY }}
    outputs:
      public_ip: ${{ steps.out.outputs.public_ip }}
      app_url: ${{ steps.out.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # so `terraform output -raw` gives clean values

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read outputs
        id: out
        if: github.event_name != 'pull_request'
        run: |
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "app_url=$(terraform output -raw app_url)"   >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  # 3. Deploy: ship the code to EC2 over SSH and restart the service.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: terraform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.terraform.outputs.app_url }}
    env:
      HOST: ${{ needs.terraform.outputs.public_ip }}
      SSH_USER: ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Wait for SSH to come up
        run: |
          for i in $(seq 1 30); do
            if ssh-keyscan -T 5 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              echo "SSH is reachable"; exit 0
            fi
            echo "Waiting for SSH ($i/30)..."; sleep 10
          done
          echo "SSH never became reachable"; exit 1

      - name: Wait for first-boot setup (cloud-init) to finish
        run: ssh -i ~/.ssh/deploy_key "$SSH_USER@$HOST" "cloud-init status --wait"

      - name: Copy application code
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            app requirements.txt "$SSH_USER@$HOST:/opt/flask-app/"

      - name: Install dependencies & restart service
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$HOST" bash -s <<EOF
            set -e
            /opt/flask-app/venv/bin/pip install --quiet -r /opt/flask-app/requirements.txt
            echo "APP_VERSION=${GITHUB_SHA::7}" > /opt/flask-app/.env
            sudo systemctl restart flask-app
            sudo systemctl status flask-app --no-pager
          EOF

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://$HOST/health"; then
              echo; echo "Deployed version:"; curl -fsS "http://$HOST/"; echo
              exit 0
            fi
            echo "App not ready yet ($i/10)..."; sleep 5
          done
          echo "Smoke test failed"; exit 1
